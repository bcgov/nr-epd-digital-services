query getApplicationById($applicationId: Int!) {
  getApplicationDetailsById(id: $applicationId) {
    data {
      id
      formId
      submissionId
      receivedDate
      hasBeenWithdrawn
      currentStatus {
        id
        abbrev
        description
      }
      appType {
        description
      }
    }
  }
}

query getSubmissionByApplicationId($applicationId: Int!) {
  getSubmissionByApplicationId(applicationId: $applicationId) {
    message
    httpStatusCode
    success
    data {
      id
      applicationId
      chefsFormId
      chefsSubmissionId
      chefsConfirmationId
      linkedConfirmationIds
      formData
      formSchema
      receivedAt
    }
  }
}

query getApplicationStatusTypes {
  getAllStatusTypes {
    id
    abbrev
    description
  }
}

mutation updateApplicationStatus(
  $applicationId: Int!
  $statusTypeId: Int!
  $comment: String
) {
  updateApplicationStatus(
    applicationId: $applicationId
    statusTypeId: $statusTypeId
    comment: $comment
  ) {
    message
    httpStatusCode
    success
  }
}
