query getSdsDisclosurePreview($applicationId: Int!) {
  getSdsDisclosurePreview(applicationId: $applicationId) {
    message
    httpStatusCode
    success
    data {
      siteRegDateRecd
      dateCompleted
      localAuthDateRecd
      rwmDateDecision
      siteRegDateEntered
      schedule2References {
        code
        description
      }
      plannedActivityComment
      siteDisclosureComment
      govDocumentsComment
    }
  }
}
