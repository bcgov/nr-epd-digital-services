apiVersion: v1
kind: ConfigMap
metadata:
  name: cats-frontend
  namespace: e38158-prod
  labels:
    app.kubernetes.io/name: cats-frontend
data:
  VITE_AUTH_LOGOUT_REDIRECT_URI: >-
    https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi?retnow=1&returl=https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/protocol/openid-connect/logout?post_logout_redirect_uri=https://nr-epd-digital-services-prod-frontend.apps.silver.devops.gov.bc.ca/
  VITE_CATS_CSSA_MANAGER_ROLE: ''
  VITE_INTERNAL_USER_ROLE: site-internal-user
  VITE_AUTH_REDIRECT_URI: 'https://nr-epd-digital-services-prod-frontend.apps.silver.devops.gov.bc.ca'
  VITE_AUTH_LOAD_USER_INFO: 'true'
  VITE_AUTH_AUTHORITY: >-
    https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/
  VITE_FORM_FLOW_API: 'https://forms-flow-forms-e38158-prod.apps.silver.devops.gov.bc.ca'
  VITE_SITE_REGISTRY_URL: 'https://nr-site-registry-prod-frontend.apps.silver.devops.gov.bc.ca'
  VITE_GEOCODER_API: 'https://geocoder.api.gov.bc.ca'
  VITE_FORM_BACKEND_API: 'https://epd-backend-applications-prod.apps.silver.devops.gov.bc.ca'
  VITE_AUTH_CLIENT_ID: cats-web
  VITE_AUTH_FILTER_PROTOCOL_CLAIMS: 'true'
  VITE_BACKEND_API: 'https://nr-epd-digital-services-1264-backend.apps.silver.devops.gov.bc.ca'
  config.js: |-
    // runtime-config.js vars
      window["_env_"] =  {
     "VITE_BACKEND_API": "https://nr-epd-digital-services-prod-backend.apps.silver.devops.gov.bc.ca",
     "VITE_AUTH_AUTHORITY": "https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/",
     "VITE_AUTH_CLIENT_ID": "cats-service",
     "VITE_AUTH_REDIRECT_URI": "https://nr-epd-digital-services-prod-frontend.apps.silver.devops.gov.bc.ca",
     "VITE_AUTH_LOGOUT_REDIRECT_URI": "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi?retnow=1&returl=https://epd-keycloak-prod.apps.silver.devops.gov.bc.ca/auth/realms/forms-flow-ai/protocol/openid-connect/logout?post_logout_redirect_uri=https://nr-epd-digital-services-prod-frontend.apps.silver.devops.gov.bc.ca/",
     "VITE_AUTH_RESPONSE_TYPE": "code",
        "VITE_AUTH_SCOPE": "openid profile",   
        "VITE_AUTH_FILTER_PROTOCOL_CLAIMS": "true",
     "VITE_AUTH_LOAD_USER_INFO": "true",
        "VITE_GEOCODER_API": "https://geocoder.api.gov.bc.ca",
     "VITE_AUTH_REVOKE_TOKENS_ON_SIGNOUT": "",
     "VITE_SITE_REGISTRAR_USER_ROLE": "site-registrar",
     "VITE_INTERNAL_USER_ROLE": "site-internal-user",
     "VITE_SITE_REGISTRY_URL": "https://nr-site-registry-prod-frontend.apps.silver.devops.gov.bc.ca",
     "VITE_FORM_API": "https://forms-flow-api-e38158-prod.apps.silver.devops.gov.bc.ca",
     "VITE_FORM_BACKEND_API": "https://epd-backend-applications-prod.apps.silver.devops.gov.bc.ca",
     "VITE_FORM_FLOW_API": "https://forms-flow-forms-e38158-prod.apps.silver.devops.gov.bc.ca",
     "VITE_CATS_CSSA_MANAGER_ROLE": "",
     }
  VITE_AUTH_SCOPE: openid profile
  VITE_AUTH_REVOKE_TOKENS_ON_SIGNOUT: 'true'
  VITE_FORM_API: 'https://forms-flow-api-e38158-prod.apps.silver.devops.gov.bc.ca'
  VITE_SITE_REGISTRAR_USER_ROLE: site-registrar
  VITE_AUTH_RESPONSE_TYPE: code
binaryData: {}
