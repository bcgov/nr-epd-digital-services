kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: cats-frontend
  namespace: e38158-tools
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: 'https://github.com/bcgov/nr-epd-digital-services.git'
      ref: 'dev'
    contextDir: cats-frontend
  strategy:
    type: Docker
    dockerStrategy:
      env:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: 'cats-frontend:dev'
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: cats-webhook-secret
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1500m"
      memory: "4Gi"
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
