kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: cats-backend-init
  namespace: e38158-tools
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: 'https://github.com/bcgov/nr-epd-digital-services.git'
      ref: 'dev'
    contextDir: backend/cats
  strategy:
    type: Docker
    dockerStrategy:
      env:
      dockerfilePath: Dockerfile.init
  output:
    to:
      kind: ImageStreamTag
      name: 'cats-backend-init:dev'
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: cats-webhook-secret
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
