# This is a temporary cronjbob to clean up pgBackrest logs until the issue is resolved in pgBackrest itself.
# The upstream bug is tracked here: https://github.com/CrunchyData/postgres-operator/issues/4142
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cats-postgres-cluster-log-rotator
  namespace: e38158-test
spec:
  schedule: '12 9 * * *' # 2:12am Pacific Time daily (12 min offset from the top of the hour to avoid sharing resources with other workloads)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              image: registry.redhat.io/openshift4/ose-cli:4.13
              env:
                - name: CRUNCHY_CLUSTER
                  value: cats-postgres-cluster
              command:
                - /bin/sh
                - '-c'
                - |
                  echo "Starting log cleanup job...";
                  for pod in $(oc get pods -l "postgres-operator.crunchydata.com/data=postgres,postgres-operator.crunchydata.com/cluster=$CRUNCHY_CLUSTER" -o name); do 
                    echo "Processing pod: $pod";
                    oc exec -it $pod -- bash -c "
                      echo 'Moving old log file...';
                      mv /pgdata/pgbackrest/log/db-archive-get-async.log /pgdata/pgbackrest/log/db-archive-get-async.log.old;
                      echo 'Compressing old log file...';
                      gzip -f /pgdata/pgbackrest/log/db-archive-get-async.log.old;
                      echo 'Log cleanup completed for $pod';
                    ";
                  done;
                  echo "Log cleanup job completed.";
          restartPolicy: Never
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
